name: Agent factory

# Reusable workflow. A project calls it from a small .github/workflows/agent.yml
# (see examples/agent.yml) that owns the triggers, permissions and secrets.
#
# Every run starts with `route`, then runs at most one of the other jobs:
#
#   GitHub event ──► route ──► design   issue → design PR (or questions); design feedback
#   (issue, comment,       ├─► develop  implement the approved design; fix findings/feedback
#    review, dispatch)     ├─► review   build + test (deterministic), then reviewer agent
#                          ├─► judge    auto-merge or hand to a human
#                          └─► control  /agent stop, queue feedback, merge on approval,
#                                       close the issue after a human merge
#
# Human events (issues, comments, reviews) and the agents' own handoffs both enter
# through `route`. A stage hands off by dispatching this same workflow
# (workflow_dispatch with stage + number), because events made with GITHUB_TOKEN
# don't trigger workflows. `route` (agent/lib/core.cjs → route) decides from the
# event plus the state stored in the PR description.
#
# Each agent job has the same steps:
#   1. checkout project/.github/agent from the DEFAULT branch (settings, prompt overrides)
#   2. stages: <stage>.prepare   read GitHub, write the prompt to runtime/<role>-prompt.md
#   3. checkout work/ at the PR head (no credentials)
#   4. run-claude                the agent edits work/ and returns runtime/<role>-result.json
#   5. stages: <stage>.publish   validate, commit + push, comment, advance state, dispatch next
#   6. stages: failure           (only on failure) tell the humans on the PR / issue
#
# Factory code comes from the actions at @v1. Project settings and prompt overrides
# come from the project's default branch (.github/agent), never from a PR branch.
on:
  workflow_call:
    inputs:
      agent-users:
        description: "Comma-separated logins allowed to drive the agents (default: the repo owner)"
        type: string
        default: ''
      model:
        description: Override the model from config.json
        type: string
        default: ''
      build-runner:
        description: >-
          Runner label for the jobs that build and test the project (develop and review),
          e.g. macos-15 for an Apple platform project. The other jobs always use Linux.
        type: string
        default: ubuntu-24.04
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false

permissions: {}

env:
  RUNTIME_DIR: ${{ github.workspace }}/runtime
  WORK_DIR: ${{ github.workspace }}/work
  PROJECT_AGENT_DIR: ${{ github.workspace }}/project/.github/agent
  AGENT_USERS: ${{ inputs.agent-users }}

jobs:
  route:
    # Ignore events caused by the agents themselves (GITHUB_TOKEN events don't
    # trigger workflows anyway, except workflow_dispatch handoffs).
    if: github.event_name == 'workflow_dispatch' || github.event.sender.type != 'Bot'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      route: ${{ steps.route.outputs.route }} # the decision as JSON → env ROUTE in each job
      stage: ${{ steps.route.outputs.stage }} # for the jobs' `if:`
      issue: ${{ steps.route.outputs.issue }} # for the per-issue concurrency group
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: project
          sparse-checkout: .github/agent
          persist-credentials: false
      - id: route
        uses: hobei/agent-factory/actions/stages@v1
        with:
          call: route

  # /agent stop, queueing human feedback while agents are busy, merging on a human
  # approval, and closing the issue after a human merge.
  control:
    needs: route
    if: needs.route.outputs.stage == 'control'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: project
          sparse-checkout: .github/agent
          persist-credentials: false
      - uses: hobei/agent-factory/actions/stages@v1
        env:
          ROUTE: ${{ needs.route.outputs.route }}
        with:
          call: control

  # Clarify the issue, or write / revise the design PR. After a human asks for a
  # design change on an approved PR (amend), it also hands straight on to develop.
  design:
    needs: route
    if: needs.route.outputs.stage == 'design'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: agent-issue-${{ needs.route.outputs.issue }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    env:
      ROUTE: ${{ needs.route.outputs.route }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: project
          sparse-checkout: .github/agent
          persist-credentials: false
      - id: prepare
        uses: hobei/agent-factory/actions/stages@v1
        with:
          call: design.prepare
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.prepare.outputs.ref }}
          path: work
          fetch-depth: 0
          persist-credentials: false
      - uses: hobei/agent-factory/actions/run-claude@v1
        with:
          role: designer
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: ${{ inputs.model }}
      - uses: hobei/agent-factory/actions/stages@v1
        env:
          PUSH_TOKEN: ${{ github.token }}
        with:
          call: design.publish
      - if: failure()
        uses: hobei/agent-factory/actions/stages@v1
        env:
          STAGE: design
        with:
          call: failure

  # Implement the frozen approved design; push and hand off to review.
  develop:
    needs: route
    if: needs.route.outputs.stage == 'develop'
    runs-on: ${{ inputs.build-runner || 'ubuntu-24.04' }}
    timeout-minutes: 60
    concurrency:
      group: agent-issue-${{ needs.route.outputs.issue }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    env:
      ROUTE: ${{ needs.route.outputs.route }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: project
          sparse-checkout: .github/agent
          persist-credentials: false
      - id: prepare
        uses: hobei/agent-factory/actions/stages@v1
        with:
          call: develop.prepare
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.prepare.outputs.ref }}
          path: work
          fetch-depth: 0
          persist-credentials: false
      - uses: hobei/agent-factory/actions/run-claude@v1
        with:
          role: developer
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: ${{ inputs.model }}
      - uses: hobei/agent-factory/actions/stages@v1
        with:
          call: develop.between
      - uses: hobei/agent-factory/actions/stages@v1
        env:
          PUSH_TOKEN: ${{ github.token }}
        with:
          call: develop.publish
      - if: failure()
        uses: hobei/agent-factory/actions/stages@v1
        env:
          STAGE: develop
        with:
          call: failure

  # Deterministic CI, then independent review; loops back to develop on findings.
  review:
    needs: route
    if: needs.route.outputs.stage == 'review'
    runs-on: ${{ inputs.build-runner || 'ubuntu-24.04' }}
    timeout-minutes: 45
    concurrency:
      group: agent-issue-${{ needs.route.outputs.issue }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    env:
      ROUTE: ${{ needs.route.outputs.route }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: project
          sparse-checkout: .github/agent
          persist-credentials: false
      - id: prepare
        uses: hobei/agent-factory/actions/stages@v1
        with:
          call: review.prepare
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.prepare.outputs.ref }}
          path: work
          fetch-depth: 0
          persist-credentials: false
      - name: Build and test (CI)
        id: ci
        continue-on-error: true
        working-directory: work
        env:
          BUILD_CMD: ${{ steps.prepare.outputs.build }}
          TEST_CMD: ${{ steps.prepare.outputs.test }}
        run: |
          set -o pipefail
          { bash -c "$BUILD_CMD" && bash -c "$TEST_CMD"; } 2>&1 | tee "$RUNTIME_DIR/ci.log"
      - uses: hobei/agent-factory/actions/stages@v1
        env:
          CI_OUTCOME: ${{ steps.ci.outcome }}
        with:
          call: review.prompt
      - uses: hobei/agent-factory/actions/run-claude@v1
        with:
          role: reviewer
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: ${{ inputs.model }}
      - uses: hobei/agent-factory/actions/stages@v1
        env:
          CI_OUTCOME: ${{ steps.ci.outcome }}
        with:
          call: review.publish
      - if: failure()
        uses: hobei/agent-factory/actions/stages@v1
        env:
          STAGE: review
        with:
          call: failure

  # Judge: auto-merge small low-risk changes, otherwise hand to a human.
  judge:
    needs: route
    if: needs.route.outputs.stage == 'judge'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: agent-issue-${{ needs.route.outputs.issue }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: read
    env:
      ROUTE: ${{ needs.route.outputs.route }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: project
          sparse-checkout: .github/agent
          persist-credentials: false
      - id: prepare
        uses: hobei/agent-factory/actions/stages@v1
        with:
          call: judge.prepare
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.prepare.outputs.ref }}
          path: work
          fetch-depth: 0
          persist-credentials: false
      - uses: hobei/agent-factory/actions/stages@v1
        with:
          call: judge.prompt
      - uses: hobei/agent-factory/actions/run-claude@v1
        with:
          role: judge
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: ${{ inputs.model }}
      - uses: hobei/agent-factory/actions/stages@v1
        with:
          call: judge.publish
      - if: failure()
        uses: hobei/agent-factory/actions/stages@v1
        env:
          STAGE: judge
        with:
          call: failure
